[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El área privada y el CMS no deben indexarse.
[[headers]]
  for = "/miembros/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Archivos con hash en el nombre (CSS, JS, fuentes): nunca cambian, caché de 1 año.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Recursos de marca: caché de 1 semana; se revalidan en segundo plano.
[[headers]]
  for = "/marca/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
